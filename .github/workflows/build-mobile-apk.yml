name: Build Mobile APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 1.0.1)'
        required: true
        default: '1.0.0'
  push:
    branches: [ "master" ]
    paths:
      - 'singgah-pos-mobile/**'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: singgah-pos-mobile

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: singgah-pos-mobile/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Generate version
      id: version
      run: |
        VERSION="${{ github.event.inputs.version || '1.0.0' }}"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        npx expo-version set --version $VERSION

    - name: Prebuild (Eject to Android project)
      run: npx expo prebuild --platform android --clean

    - name: Build APK (Release)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Rename APK
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        cp android/app/build/outputs/apk/release/app-release.apk \
          singgah-pos-mobile-$VERSION.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: singgah-pos-mobile-apk
        path: singgah-pos-mobile/singgah-pos-mobile-*.apk
        retention-days: 90

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.event_name == 'workflow_dispatch'
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Singgah POS Mobile v${{ steps.version.outputs.version }}
        body: |
          ## Singgah POS Mobile v${{ steps.version.outputs.version }}

          Android APK release for Singgah Coffee POS mobile app.

          ### Install
          Download the APK below and install on Android 8.0+ devices.
          Enable "Install from Unknown Sources" in Settings → Security if needed.

          ### Changelog
          - See commit history for details.
        files: singgah-pos-mobile/singgah-pos-mobile-*.apk
