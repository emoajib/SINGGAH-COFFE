name: Singgah POS CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  backend-check:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Build Backend
      run: |
        cd backend
        go build -v ./cmd/server

    - name: Run Backend Tests
      run: |
        cd backend
        go test -v ./...

  web-dashboard-check:
    name: Web Dashboard Build Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: web-dashboard/package-lock.json

    - name: Install Dependencies
      run: |
        cd web-dashboard
        npm ci

    - name: Build Dashboard
      run: |
        cd web-dashboard
        npm run build

  integration-test:
    name: Integration Test (Docker Compose)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: singgah_pos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Start Backend
      env:
        JWT_SECRET: ci-test-secret-key-thats-at-least-32-characters-long
        DATABASE_URL: host=localhost user=postgres password=password dbname=singgah_pos port=5432 sslmode=disable
      run: |
        cd backend
        go run ./cmd/server &
        sleep 3
        # Wait for backend to be healthy
        for i in $(seq 1 10); do
          if curl -s http://localhost:8080/health | grep -q '"ok"'; then
            echo "Backend is healthy"
            break
          fi
          echo "Waiting for backend... attempt $i"
          sleep 2
        done

    - name: Smoke Test — Health Check
      run: curl -s http://localhost:8080/health | grep '"status":"ok"'

    - name: Smoke Test — Login Endpoint
      run: |
        curl -s -X POST http://localhost:8080/api/auth/login \
          -H "Content-Type: application/json" \
          -d '{"email":"admin@singgahcoffee.com","password":"admin123"}' \
          | grep -q "token" && echo "Login works" || echo "Login failed (expected without seed)"

    - name: Stop Backend
      if: always()
      run: pkill -f "go run.*cmd/server" || true

  mobile-app-check:
    name: Mobile POS Type Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: singgah-pos-mobile/package-lock.json

    - name: Install Dependencies
      run: |
        cd singgah-pos-mobile
        npm ci

    - name: Run Type Check (TypeScript)
      run: |
        cd singgah-pos-mobile
        npx tsc --noEmit
