name: Singgah POS CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  backend-check:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Build Backend
      run: |
        cd backend
        go build -v ./cmd/server

    - name: Run Backend Tests
      run: |
        cd backend
        go test -v ./...

  web-dashboard-check:
    name: Web Dashboard Build Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: web-dashboard/package-lock.json

    - name: Install Dependencies
      run: |
        cd web-dashboard
        npm ci

    - name: Build Dashboard
      run: |
        cd web-dashboard
        npm run build

  integration-test:
    name: Integration Test (Docker Compose)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: singgah_pos
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Start Backend
      env:
        JWT_SECRET: ci-test-secret-key-thats-at-least-32-characters-long
        DATABASE_URL: root:password@tcp(localhost:3306)/singgah_pos?charset=utf8mb4&parseTime=True&loc=Local
      run: |
        cd backend
        go run ./cmd/server &
        sleep 3
        # Wait for backend to be healthy
        for i in $(seq 1 10); do
          if curl -s http://localhost:8080/health | grep -q '"ok"'; then
            echo "Backend is healthy"
            break
          fi
          echo "Waiting for backend... attempt $i"
          sleep 2
        done

    - name: Smoke Test — Health Check
      run: curl -s http://localhost:8080/health | grep '"status":"ok"'

    - name: Smoke Test — Login Endpoint
      run: |
        curl -s -X POST http://localhost:8080/api/auth/login \
          -H "Content-Type: application/json" \
          -d '{"email":"admin@singgahcoffee.com","password":"admin123"}' \
          | grep -q "token" && echo "Login works" || echo "Login failed (expected without seed)"

    - name: Stop Backend
      if: always()
      run: pkill -f "go run.*cmd/server" || true

