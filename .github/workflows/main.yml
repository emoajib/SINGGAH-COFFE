name: Singgah POS CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  shared-hosting-constraints:
    name: Shared Hosting Constraint Guard
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run constraint guard
      run: ./scripts/check-constraints.sh
    - name: Validate deploy artifact not tracked
      run: |
        if git ls-files --error-unmatch deploy.tar.gz >/dev/null 2>&1; then
          echo "FAIL: deploy.tar.gz masih tracked (artifact stale + bocor secret)"
          exit 1
        fi

  backend-check:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache-dependency-path: backend/go.sum

    - name: Build Backend
      run: |
        cd backend
        go build -v ./cmd/server

    - name: Run Backend Tests
      run: |
        cd backend
        go test -v ./...

  web-dashboard-check:
    name: Web Dashboard Build Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: web-dashboard/package-lock.json

    - name: Install Dependencies
      run: |
        cd web-dashboard
        npm ci

    - name: Build Dashboard
      run: |
        cd web-dashboard
        npm run build

  integration-test:
    name: Integration Test (Docker Compose)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: singgah_pos
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache-dependency-path: backend/go.sum

    - name: Start Backend
      env:
        JWT_SECRET: ci-test-secret-key-thats-at-least-32-characters-long
        DATABASE_URL: root:password@tcp(localhost:3306)/singgah_pos?charset=utf8mb4&parseTime=True&loc=Local
      run: |
        cd backend
        go run ./cmd/server &
        sleep 3
        # Wait for backend to be healthy
        for i in $(seq 1 10); do
          if curl -s http://localhost:8080/health | grep -q '"ok"'; then
            echo "Backend is healthy"
            break
          fi
          echo "Waiting for backend... attempt $i"
          sleep 2
        done

    - name: Smoke Test — Health Check
      run: curl -s http://localhost:8080/health | grep '"status":"ok"'

    - name: Smoke Test — Login Endpoint
      run: |
        curl -s -X POST http://localhost:8080/api/auth/login \
          -H "Content-Type: application/json" \
          -d '{"email":"admin@singgahcoffee.com","password":"admin123"}' \
          | grep -q "token" && echo "Login works" || echo "Login failed (expected without seed)"

    - name: Stop Backend
      if: always()
      run: pkill -f "go run.*cmd/server" || true

  publish-deploy-package:
    name: Build & Publish deploy.tar.gz
    runs-on: ubuntu-latest
    needs: [shared-hosting-constraints, backend-check, web-dashboard-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build backend binary (Linux)
        run: |
          mkdir -p deploy/backend deploy/web deploy/scripts
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../deploy/backend/singgah-backend ./cmd/server

      - name: Build frontend
        run: |
          cd web-dashboard
          npm ci
          npm run build
          cp -r dist/* ../deploy/web/

      - name: Bundle deploy package
        run: |
          cd "$GITHUB_WORKSPACE"
          echo "SHORT_SHA=$(cut -c1-8 <<< "${GITHUB_SHA}")" >> "$GITHUB_ENV"
          cp backend/start.sh deploy/start.sh
          cp api-proxy.php deploy/
          cp .htaccess deploy/
          cp scripts/*.sh deploy/scripts/ 2>/dev/null || true
          # CATATAN: backend/.env TIDAK disertakan (repo & release publik — bocor kredensial).
          # Operator mengisi backend/.env di server sendiri (lihat deploy-manual / update-webhosting).
          tar -czf deploy.tar.gz -C deploy .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: deploy-${{ env.SHORT_SHA }}
          name: "Deploy package ${{ env.SHORT_SHA }} (${{ github.sha }})"
          body: |
            Auto-generated deploy package from CI.

            - Backend binary (Linux amd64)
            - Frontend build
            - start.sh (hardened: GOMAXPROCS=1, GOMEMLIMIT=200MiB), api-proxy.php, .htaccess
            - Scripts

            Kredensial TIDAK disertakan — isi `backend/.env` di server sebelum start.

            Commit: ${{ github.sha }}
          files: deploy.tar.gz
          prerelease: false
          generate_release_notes: false

