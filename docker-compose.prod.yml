version: '3.8'

services:
  # 1. Database Service (MySQL)
  db:
    image: mysql:8
    container_name: singgah_mysql_prod
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-securepassword}
      MYSQL_DATABASE: singgah_pos
    volumes:
      - mysql_prod_data:/var/lib/mysql
    restart: always
    networks:
      - singgah_network

  # 2. Backend API Service (Go)
  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: singgah_api_prod
    environment:
      PORT: 8080
      DATABASE_URL: "root:${DB_PASSWORD:-securepassword}@tcp(db:3306)/singgah_pos?charset=utf8mb4&parseTime=True&loc=Local"
    depends_on:
      - db
    restart: always
    networks:
      - singgah_network

  # 3. Frontend Web Dashboard (React + Nginx)
  web:
    build:
      context: ./web-dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.singgah.coffee}
    container_name: singgah_web_prod
    ports:
      - "80:80" # Exposed to the internet
    depends_on:
      - api
    restart: always
    networks:
      - singgah_network

networks:
  singgah_network:
    driver: bridge

volumes:
  mysql_prod_data:
