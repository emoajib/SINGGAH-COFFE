services:
  # Database Service
  db:
    image: mysql:8
    container_name: singgah_mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: singgah_pos
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

  # Backend API Service
  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: singgah_api
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: "root:password@tcp(db:3306)/singgah_pos?charset=utf8mb4&parseTime=True&loc=Local"
      JWT_SECRET: "singgah-coffee-jwt-secret-key-change-this-in-prod-2026"
    depends_on:
      - db
    restart: always

  # Web Dashboard Service
  web:
    build:
      context: ./web-dashboard
      dockerfile: Dockerfile
    container_name: singgah_web
    ports:
      - "3000:80"
    volumes:
      - ./web-dashboard:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
    depends_on:
      - api
    restart: always

volumes:
  mysql_data:
